<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicaLingo - Administrar Usuarios</title>
    <link rel="icon" href="../assets/imagenes/coco/mascota.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/add_leccion.css">
</head>
<body>

    <aside>
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> NicaLingo Admin
        </div>
        <ul class="sidebar-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="add_leccion.html"><i class="fa-solid fa-book-medical"></i> Crear Lección</a></li>
            <li><a href="add_book.html"><i class="fa-solid fa-book-open"></i> Agregar Libros</a></li>
            <li><a href="edit_book.html"><i class="fa-solid fa-book-atlas"></i> Administrar Libros</a></li>
            <li><a href="historial_lecciones.html"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
            <li><a href="admin_user.html" class="active"><i class="fa-solid fa-users"></i> Administradores</a></li>
        </ul>
        <button id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
    </aside>

    <main>
        <header>
            <h1>AJUSTES Y GESTIÓN DE USUARIOS</h1>
        </header>

        <div id="adminSection" style="display: none;">
            <section class="editor-card" style="margin-bottom: 20px;">
                <div class="card-header-bar">
                    <span class="step-badge">1</span>
                    <h2>Otorgar o Modificar Permisos de Usuario</h2>
                </div>
                <div class="card-body">
                    <form id="roleForm">
                        <div class="form-group">
                            <label for="userEmail">Correo del usuario</label>
                            <input type="email" id="userEmail" placeholder="usuario@correo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="newRole">Asignar Rol</label>
                            <select id="newRole" required>
                                <option value="editor">Editor</option>
                                <option value="admin">Administrador</option>
                                <option value="user">Usuario Estándar</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-guardar-main" style="margin-top: 10px;">Actualizar Rol</button>
                    </form>
                </div>
            </section>
        </div>

        <div id="unauthorizedSection" style="display: none; padding: 20px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 6px; color: #856404;">
            <i class="fa-solid fa-triangle-exclamation"></i> Acceso restringido. Solo los administradores pueden gestionar los permisos de otros usuarios.
        </div>
    </main>

    <script type="module" src="../script/admin_user.js"></script>
</body>
</html>
