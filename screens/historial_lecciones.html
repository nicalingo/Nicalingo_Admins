<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Lecciones - NicaLingo Admin</title>
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CORREGIDO: Subir un nivel con '../' para encontrar la carpeta styles -->
    <link rel="stylesheet" href="../styles/historial_lecciones.css">
</head>
<body>

    <!-- Menú Lateral -->
    <aside>
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> NicaLingo Admin
        </div>
        <ul class="sidebar-menu">
            <!-- Asegúrate de que los enlaces apunten a los nombres reales de tus archivos en 'screens/' -->
            <li><a href="home.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="add_leccion.html"><i class="fa-solid fa-book-medical"></i> Crear Lección</a></li>
            <li><a href="historial_lecciones.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
            <li><a href="admin_user.html"><i class="fa-solid fa-gear"></i> Ajustes</a></li>
        </ul>
        <button id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
    </aside>

    <!-- Contenido Principal -->
    <main>
        <header>
            <h1>Gestión y Historial de Lecciones</h1>
        </header>

        <!-- Filtros Dinámicos -->
        <section class="filters-container">
            <div class="filter-group">
                <label for="filterLevel">Nivel</label>
                <select id="filterLevel">
                    <option value="">Todos los niveles</option>
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterLessonNum">Número de Lección</label>
                <input type="number" id="filterLessonNum" placeholder="Ej. 1, 2...">
            </div>

            <div class="filter-group">
                <label for="filterCreator">Creador (Correo)</label>
                <input type="text" id="filterCreator" placeholder="Filtrar por autor">
            </div>
        </section>

        <!-- Tabla de Datos -->
        <section class="table-container">
            <div id="loadingMessage">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando lecciones...
            </div>
            
            <table id="historyTable" class="history-table">
                <thead>
                    <tr>
                        <th>Nivel / Idioma</th>
                        <th>Lección</th>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Creador</th>
                        <th>Recompensa</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- Las filas se renderizan dinámicamente desde el archivo JS -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- CORREGIDO: Subir un nivel con '../' para encontrar la carpeta script -->
    <script type="module" src="../script/historial_lecciones.js"></script>
</body>
</html>
