<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicaLingo - Administrar Libros / Historias</title>
    <link rel="icon" href="../assets/imagenes/coco/mascota.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Global Unificado de Sinskira -->
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> 
            <span class="nav-text" id="brandRoleText">NicaLingo Admin</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> <span class="nav-text">Home</span></a></li>
            
            <li class="has-submenu">
                <a href="#" class="submenu-toggle"><i class="fa-solid fa-book"></i> <span class="nav-text">Lecciones</span> <i class="fa-solid fa-chevron-down toggle-icon"></i></a>
                <ul class="submenu">
                    <li><a href="add_leccion.html"><span class="nav-text">Agregar</span></a></li>
                    <li><a href="historial_lecciones.html"><span class="nav-text">Historial</span></a></li>
                </ul>
            </li>

            <li class="has-submenu show">
                <a href="#" class="submenu-toggle"><i class="fa-solid fa-book-open"></i> <span class="nav-text">Libros</span> <i class="fa-solid fa-chevron-down toggle-icon"></i></a>
                <ul class="submenu">
                    <li><a href="add_book.html"><span class="nav-text">Agregar</span></a></li>
                    <li class="active"><a href="edit_book.html"><span class="nav-text">Historial</span></a></li>
                </ul>
            </li>

            <!-- Restringido a Administrador -->
            <li class="has-submenu" data-role="admin-only">
                <a href="#" class="submenu-toggle"><i class="fa-solid fa-users-gear"></i> <span class="nav-text">Admin</span> <i class="fa-solid fa-chevron-down toggle-icon"></i></a>
                <ul class="submenu">
                    <li><a href="admin_user.html"><span class="nav-text">Ajustes Generales</span></a></li>
                    <li><a href="admin_user.html#permisos"><span class="nav-text">Gestión de Usuarios</span></a></li>
                </ul>
            </li>

            <!-- Restringido a Administrador -->
            <li data-role="admin-only"><a href="#"><i class="fa-solid fa-school"></i> <span class="nav-text">Colegios</span></a></li>
        </ul>

        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn-logout" title="Cerrar sesión">
                <i class="fa-solid fa-right-from-bracket"></i> 
                <span class="nav-text">Cerrar sesión</span>
            </button>
        </div>
    </aside>

    <main>
        <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i> Menú</button>

        <header>
            <h1>ADMINISTRACIÓN DE LIBROS E HISTORIAS</h1>
        </header>

        <section class="filters-container">
            <div class="filter-group" style="flex: 1; min-width: 250px;">
                <label for="searchBook">Buscar por Título o Autor</label>
                <div class="search-input-wrapper" style="position: relative; display: flex; align-items: center;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; color: var(--sinskira-sage); font-size: 15px; pointer-events: none;"></i>
                    <input type="text" id="searchBook" placeholder="Escribe para buscar..." style="padding-left: 42px;">
                </div>
            </div>

            <div class="filter-group" style="width: 220px;">
                <label for="filterTag">Filtrar por Etiqueta</label>
                <div class="search-input-wrapper" style="position: relative; display: flex; align-items: center;">
                    <i class="fa-solid fa-tag" style="position: absolute; left: 14px; color: var(--sinskira-sage); font-size: 15px; pointer-events: none;"></i>
                    <select id="filterTag" style="padding-left: 42px; cursor: pointer;">
                        <option value="">Todas las etiquetas</option>
                        <option value="tradicion">Tradición</option>
                        <option value="leyenda">Leyenda</option>
                        <option value="historia">Historia</option>
                        <option value="cuento">Cuento</option>
                    </select>
                </div>
            </div>
        </section>

        <div class="table-container" style="background: transparent; border: none; box-shadow: none;">
            <div id="loadingMessage" style="text-align: center; padding: 30px; color: var(--text-secondary);">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Cargando el conocimiento ancestral...
            </div>
            
            <div id="booksContainer" class="books-grid" style="display: none;">
                <!-- Las tarjetas de libros se renderizan dinámicamente desde edit_book.js -->
            </div>
        </div>
    </main>

    <script src="../script/sidebar.js"></script>
    <script type="module" src="../script/edit_book.js"></script>
</body>
</html>
