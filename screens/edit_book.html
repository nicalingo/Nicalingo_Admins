<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicaLingo - Administrar Libros / Historias</title>
    <link rel="icon" href="../assets/imagenes/coco/mascota.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/add_leccion.css">
    <style>
        /* Estilos para el contenedor de tarjetas */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .book-card-header {
            display: flex;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .book-card-cover {
            width: 65px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .book-card-info {
            flex: 1;
            min-width: 0;
        }

        .book-card-title {
            color: #1c3d98;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-card-author {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .book-card-tag {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .book-card-desc {
            color: #475569;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }

        /* Estilos modernos y atractivos para los filtros */
        .filters-container {
            margin: 20px 0 25px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .filter-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
        }

        .filter-group input[type="text"],
        .filter-group select {
            width: 100%;
            padding: 12px 16px 12px 42px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background-color: #ffffff;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .filter-group select {
            appearance: none;
            cursor: pointer;
        }

        .filter-group input[type="text"]::placeholder {
            color: #94a3b8;
        }

        .filter-group input[type="text"]:focus,
        .filter-group select:focus {
            border-color: #1c3d98;
            box-shadow: 0 0 0 3px rgba(28, 61, 152, 0.12);
        }

        .empty-library-state {
            text-align: center;
            padding: 50px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-top: 20px;
            border: 2px dashed #e2e8f0;
        }
        .empty-library-state img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            animation: floatMascot 3s ease-in-out infinite;
        }
        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i> NicaLingo Admin
        </div>
        <ul class="sidebar-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="add_leccion.html"><i class="fa-solid fa-book-medical"></i> Crear Lección</a></li>
            <li><a href="add_book.html"><i class="fa-solid fa-book-open"></i> Agregar Libros</a></li>
            <li><a href="edit_book.html" class="active"><i class="fa-solid fa-book-atlas"></i> Administrar Libros</a></li>
            <li><a href="historial_lecciones.html"><i class="fa-solid fa-clock-rotate-left"></i> Historial</a></li>
            <li><a href="admin_user.html"><i class="fa-solid fa-users"></i> Administradores</a></li>
        </ul>
        <button id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
    </aside>

    <main>
        <header>
            <h1>ADMINISTRACIÓN DE LIBROS E HISTORIAS</h1>
        </header>

        <section class="filters-container">
            <!-- Barra de búsqueda por texto -->
            <div class="filter-group" style="flex: 1; min-width: 250px;">
                <label for="searchBook">Buscar por Título o Autor</label>
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchBook" placeholder="Escribe para buscar...">
                </div>
            </div>

            <!-- Menú desplegable para filtrar por etiqueta -->
            <div class="filter-group" style="width: 220px;">
                <label for="filterTag">Filtrar por Etiqueta</label>
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-tag"></i>
                    <select id="filterTag">
                        <option value="">Todas las etiquetas</option>
                        <option value="tradicion">Tradición</option>
                        <option value="leyenda">Leyenda</option>
                        <option value="historia">Historia</option>
                        <option value="cuento">Cuento</option>
                    </select>
                </div>
            </div>
        </section>

        <div class="table-container">
            <div id="loadingMessage" style="text-align: center; padding: 30px; color: #64748b;">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Cargando el conocimiento ancestral...
            </div>
            
            <!-- Contenedor de tarjetas -->
            <div id="booksContainer" class="books-grid" style="display: none;">
                <!-- Las tarjetas se renderizarán dinámicamente aquí mediante JavaScript -->
            </div>
        </div>
    </main>

    <script type="module" src="../script/edit_book.js"></script>
</body>
</html>
